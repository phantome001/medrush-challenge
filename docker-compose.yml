services:
  postgres:
    image: postgres:16-alpine
    container_name: medrush-postgres
    environment:
      POSTGRES_USER: medrush
      POSTGRES_PASSWORD: medrush
      POSTGRES_DB: medrush
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medrush -d medrush"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: medrush-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://medrush:medrush@postgres:5432/medrush?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: development
    ports:
      - "4000:4000"
    command: sh -c "npx prisma db push && npm run seed:prod && npm run start"

  admin-dashboard:
    build:
      context: ./admin-dashboard
    container_name: medrush-admin
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:80"

volumes:
  postgres_data:
